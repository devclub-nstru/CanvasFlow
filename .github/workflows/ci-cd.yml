name: CanvasFlow CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvasflow-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI environment
        run: cp .env.example .env
      - name: Type check
        run: pnpm check-types

      - name: Build
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm build

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: canvasflow-deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_FILE_CONTENT
          command_timeout: 25m
          script: |
            set -euo pipefail

            DEPLOY_DIR="$HOME/projects/canvasflow"

            cd "$DEPLOY_DIR"

            echo "==> Updating source"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Updating environment"
            umask 077
            printf '%s\n' "$ENV_FILE_CONTENT" > .env

            echo "==> Running setup"
            chmod +x setup.sh
            ./setup.sh

            echo "==> Validating Compose configuration"
            docker compose -f docker-compose.prod.yml config -q

            echo "==> Starting infrastructure"
            docker compose -f docker-compose.prod.yml up -d postgres redis

            echo "==> Waiting for infrastructure"
            docker compose -f docker-compose.prod.yml up -d --wait postgres redis

            echo "==> Building Docker images"
            docker compose -f docker-compose.prod.yml build api worker web migrate

            echo "==> Running database migrations"
            docker compose -f docker-compose.prod.yml run --rm migrate

            echo "==> Starting application"
            docker compose -f docker-compose.prod.yml up -d api worker web

            echo "==> Waiting for application health"
            docker compose -f docker-compose.prod.yml up -d --wait api worker web

            echo "==> Deployment status"
            docker compose -f docker-compose.prod.yml ps

            echo "==> Cleaning unused images"
            docker image prune -f

            echo "==> Deployment complete"
