name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file
        if: github.ref == 'refs/heads/main'
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV }}
        run: |
          echo "$ENV_FILE_CONTENT" > .env
          bash setup.sh

      - name: Build project
        run: pnpm build

      - name: Prepare production build
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/api dist/db
          pnpm --filter @repo/api deploy --prod dist/api
          pnpm --filter @repo/database deploy --prod dist/db

          # Copy Next.js static files and public directory into standalone app
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static

      - name: Create release tarball
        if: github.ref == 'refs/heads/main'
        run: |
          tar -czf release.tar.gz \
            ecosystem.config.cjs \
            docker-compose.prod.yml \
            dist/ \
            apps/web/.next/standalone \
            .env

      - name: Copy files to server
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "release.tar.gz"
          target: "~/projects/canvasflow"

      - name: Execute post-deployment commands
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Load Node.js environment (for NVM users)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Fallback for standard bash profile
            source ~/.bash_profile || source ~/.profile || source ~/.bashrc || true

            # Add standard paths just in case
            export PATH=$PATH:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin:$HOME/.local/share/pnpm

            mkdir -p ~/projects/canvasflow
            cd ~/projects/canvasflow

            # Extract release bundle
            tar -xzf release.tar.gz
            rm -f release.tar.gz
            chmod 600 .env

            # Start Postgres and Redis containers (wait for healthy status)
            docker compose -f docker-compose.prod.yml up -d --wait || docker compose -f docker-compose.prod.yml up -d

            # Run database migrations
            if [ -d "dist/db" ]; then
              cd dist/db && node migrate.mjs && cd ../..
            fi

            # Start or reload PM2 processes
            pm2 startOrReload ecosystem.config.cjs --env production

            pm2 save


