services:
  postgres:
    image: postgres:15
    container_name: canvasflow-postgres-prod
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-canvasflow}

    command:
      - postgres
      - -c
      - max_connections=300

    ports:
      - "127.0.0.1:5444:5432"

    volumes:
      - pg_data_prod:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --host=127.0.0.1 --port=5432 -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-canvasflow}"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: canvasflow-redis-prod
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    ports:
      - "127.0.0.1:6333:6379"

    volumes:
      - redis_data_prod:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  # Backing store for the menti (live quiz/poll) service.
  mongodb:
    image: mongo:7
    container_name: canvasflow-mongo-prod
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-canvasflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    command:
      - mongod
      # Mongo otherwise reserves ~50% of host RAM for its cache, which is far
      # too much alongside Postgres, Redis and the Node processes on one VM.
      - --wiredTigerCacheSizeGB
      - "0.5"

    # 27018 on the host to avoid colliding with any system mongod on 27017.
    ports:
      - "127.0.0.1:27018:27017"

    volumes:
      - mongo_data_prod:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

volumes:
  pg_data_prod:
  redis_data_prod:
  mongo_data_prod:
