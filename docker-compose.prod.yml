services:
  postgres:
    image: postgres:15
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-canvasflow}

    command:
      - postgres
      - -c
      - max_connections=300

    volumes:
      - pg_data_prod:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-canvasflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis_data_prod:/data

    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  # Menti's datastore. Postgres holds the forms side of the product; the live
  # presentation service is document-shaped and stays on Mongo.
  mongo:
    image: mongo:7
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-menti}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-menti}

    volumes:
      - mongo_data_prod:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  migrate:
    build:
      context: .
      target: migrate

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api

    restart: unless-stopped

    # Both processes drain for up to 25s on SIGTERM; Docker's default 10s
    # would SIGKILL them mid-flight on every deploy.
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    env_file:
      - .env

    # The API only parks uploads here; the worker is what ships them to
    # Cloudinary. Both containers must see the same directory or the worker
    # reads a path that does not exist inside its own filesystem.
    environment:
      UPLOAD_TMP_DIR: /var/tmp/canvasflow-uploads

    volumes:
      - upload_tmp_prod:/var/tmp/canvasflow-uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    # /ready, not /health: /health is a liveness ping that cannot fail, so
    # polling it let a deploy with an unreachable Postgres report healthy and
    # take traffic. /ready round-trips the database and Redis and answers 503
    # when either is down.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      target: worker

    restart: unless-stopped

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    env_file:
      - .env

    environment:
      UPLOAD_TMP_DIR: /var/tmp/canvasflow-uploads

    volumes:
      - upload_tmp_prod:/var/tmp/canvasflow-uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      # Baked into the client bundle at build time — changing these in .env
      # alone does nothing until the image is rebuilt.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MENTI_API_URL: ${NEXT_PUBLIC_MENTI_API_URL}
        NEXT_PUBLIC_API_URLS: ${NEXT_PUBLIC_API_URLS:-}

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    env_file:
      - .env

    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Menti (live presentations) ────────────────────────────────────────────

  menti:
    build:
      context: .
      target: menti

    restart: unless-stopped

    # Socket.IO rooms drain on SIGTERM (sockets closed, presence flushed) with
    # a 25s internal deadline, same as the API.
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    env_file:
      - .env

    # Imported decks land on local disk unless R2/S3 is configured, and the
    # worker writes the rendered slides that this container then serves at
    # /uploads — so both must mount the same volume.
    volumes:
      - menti_uploads_prod:/app/apps/menti/uploads

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  menti-worker:
    build:
      context: .
      target: menti-worker

    restart: unless-stopped

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    env_file:
      - .env

    volumes:
      - menti_uploads_prod:/app/apps/menti/uploads

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data_prod:
  redis_data_prod:
  upload_tmp_prod:
  mongo_data_prod:
  menti_uploads_prod:
